name: Validate and publish Docker images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python3 -m py_compile web_scan_move.py clamd_client.py content_scanner.py event_writer.py safe_move.py clamav/*.py

      - name: Validate Compose example
        run: docker compose -f docker-compose.example.yml config --quiet

      - name: Build application image
        run: docker build --tag web-scan-move:test .

      - name: Run tests in the application image
        run: docker run --rm --env PYTHONPATH=/usr/local/bin --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 web-scan-move:test -m unittest discover -s /workspace/tests -v

      - name: Build ClamD image
        run: docker build --file Dockerfile.clamd --tag web-scan-move-clamd:test .

      - name: Verify non-root image users
        run: |
          test "$(docker image inspect web-scan-move:test --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect web-scan-move-clamd:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint ffprobe web-scan-move:test -version

      - name: Verify read-only-root compatibility
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --entrypoint python3 web-scan-move:test -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(encoding="utf-8")) for path in ("/usr/local/bin/web_scan_move.py", "/usr/local/bin/clamd_client.py", "/usr/local/bin/content_scanner.py", "/usr/local/bin/event_writer.py", "/usr/local/bin/safe_move.py")]'
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --entrypoint python3 web-scan-move-clamd:test -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(encoding="utf-8")) for path in ("/usr/local/bin/clamd_entrypoint.py", "/usr/local/bin/clamd_healthcheck.py")]'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate arm64 images
        run: |
          docker buildx build --platform linux/arm64 --load --tag web-scan-move:test-arm64 .
          docker buildx build --platform linux/arm64 --load --file Dockerfile.clamd --tag web-scan-move-clamd:test-arm64 .
          docker run --rm --env PYTHONPATH=/usr/local/bin --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 web-scan-move:test-arm64 -m unittest discover -s /workspace/tests -v

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web-scan-move
            dockerfile: Dockerfile
          - image: web-scan-move-clamd
            dockerfile: Dockerfile.clamd
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
