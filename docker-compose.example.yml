services:
  web-scan-move:
    image: ghcr.io/${GITHUB_OWNER:-outlain}/web-scan-move:${IMAGE_TAG:-latest}
    container_name: web-scan-move
    user: "${HELPER_UID:-10001}:${HELPER_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    network_mode: none
    environment:
      WATCH_DIR: /watch
      DEST_DIR: /dest
      QUARANTINE_DIR: /quarantine
      EVENT_DIR: /events
      STATE_DIR: /state
      CLAMD_SOCKET: /run/clamav/clamd.sock
      POLL_SECONDS: ${POLL_SECONDS:-5}
      SETTLE_SECONDS: ${SETTLE_SECONDS:-30}
      MAX_SCAN_WORKERS: ${MAX_SCAN_WORKERS:-1}
      DISCOVERY_WORKERS: ${DISCOVERY_WORKERS:-4}
      DISCOVERY_QUEUE: ${DISCOVERY_QUEUE:-64}
      MAX_DEFINITION_AGE_SECONDS: ${MAX_DEFINITION_AGE_SECONDS:-172800}
      CLAMD_CONNECT_TIMEOUT_SECONDS: ${CLAMD_CONNECT_TIMEOUT_SECONDS:-5}
      SCAN_TIMEOUT_SECONDS: ${SCAN_TIMEOUT_SECONDS:-7200}
      MAX_STREAM_MIB: ${MAX_STREAM_MIB:-2000}
      LARGE_MEDIA_ENABLED: ${LARGE_MEDIA_ENABLED:-true}
      LARGE_MEDIA_MAX_FILE_GIB: ${LARGE_MEDIA_MAX_FILE_GIB:-100}
      LARGE_MEDIA_CHUNK_MIB: ${LARGE_MEDIA_CHUNK_MIB:-1024}
      LARGE_MEDIA_OVERLAP_KIB: ${LARGE_MEDIA_OVERLAP_KIB:-1024}
      LARGE_MEDIA_PROBE_TIMEOUT_SECONDS: ${LARGE_MEDIA_PROBE_TIMEOUT_SECONDS:-120}
      LARGE_MEDIA_SCAN_TIMEOUT_SECONDS: ${LARGE_MEDIA_SCAN_TIMEOUT_SECONDS:-21600}
      FFPROBE_BINARY: /usr/bin/ffprobe
      ARCHIVE_SCAN_ENABLED: ${ARCHIVE_SCAN_ENABLED:-true}
      ARCHIVE_MAX_SOURCE_GIB: ${ARCHIVE_MAX_SOURCE_GIB:-100}
      ARCHIVE_MAX_TOTAL_GIB: ${ARCHIVE_MAX_TOTAL_GIB:-50}
      ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:-10000}
      ARCHIVE_MAX_COMPRESSION_RATIO: ${ARCHIVE_MAX_COMPRESSION_RATIO:-200}
      ARCHIVE_SCAN_TIMEOUT_SECONDS: ${ARCHIVE_SCAN_TIMEOUT_SECONDS:-21600}
      INCOMPLETE_SUFFIXES: ${INCOMPLETE_SUFFIXES:-.part,.tmp,.crdownload,.aria2,.partial,.download,.!qb}
      WATCH_MOUNT_MARKER: ${WATCH_MOUNT_MARKER:-}
      DEST_MOUNT_MARKER: ${DEST_MOUNT_MARKER:-}
      QUARANTINE_MOUNT_MARKER: ${QUARANTINE_MOUNT_MARKER:-}
    volumes:
      - /mnt/bulk/webdownloads/complete:/watch:rw
      - /mnt/bulk/webdownloads/quarantine:/quarantine:rw
      - /mnt/media/WebsiteDownloads:/dest:rw
      - /opt/docker/clamav-shared/events/web-scan-move:/events:rw
      - /opt/docker/clamav-shared/state/web-scan-move:/state:rw
      - ${WEB_CLAMD_SOCKET_HOST_DIR:-/opt/docker/clamav-shared/sockets/web-scan-move}:/run/clamav:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
    depends_on:
      web-scan-move-clamd:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web-scan-move-clamd:
    image: ghcr.io/${GITHUB_OWNER:-outlain}/web-scan-move-clamd:${IMAGE_TAG:-latest}
    container_name: web-scan-move-clamd
    user: "${HELPER_UID:-10001}:${HELPER_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    network_mode: none
    environment:
      DEFINITIONS_DIR: /var/lib/clamav
      DEFINITIONS_WAIT_TIMEOUT: "1800"
      DEFINITIONS_MAX_AGE_SECONDS: ${MAX_DEFINITION_AGE_SECONDS:-172800}
      CLAMD_SOCKET: /run/clamav/clamd.sock
    volumes:
      - /opt/docker/clamav-shared/defs:/var/lib/clamav:ro
      - ${WEB_CLAMD_SOCKET_HOST_DIR:-/opt/docker/clamav-shared/sockets/web-scan-move}:/run/clamav:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
